<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인용문과 줄바꿈</title>
    <link rel="shortcut icon" href="/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon/likelion.svg" type="image/svg+xml" />
    <link rel="preload" as="font" href="/font/suit/SUIT-Variable.woff2" />
    <link rel="stylesheet" href="/font/suit/SUIT-Variable.css" />
    <link rel="stylesheet" href="/src/common/index.css" />
  </head>
  <body style="margin: 50px">
    <div class="go-index"><a href="/index.html">Index로 이동</a></div>
    <h1>인용문과 줄바꿈</h1>
    <!-- br 요소를 사용하여 줄바꿈 적용 -->
    <p>
      멋쟁이 <br />
      사자처럼 <br />
      프론트엔드 <br />
      부트캠프 <br />
      화이팅! <br />
    </p>
    <hr />
    <!-- 블록 인용문 -->
    <!-- blockquote는 일반적으로 문단 전체를 인용할 때 사용 -->
    <!-- <cite> 태그와 cite 속성은 인용의 출처를 명시하는데 사용 -->
    <blockquote>
      <p>
        우리가 할 수 있는 노력은 &nbsp; &nbsp; 과정이 전부야. <br />
        결과는 우리 손 안에 있는 게 아니야. <br />
        결과까지 서너개 넣으려다 보니까 <br />
        무리수를 두는 거야 <br />
      </p>
    </blockquote>
    <cite>드라마 &lt;미생&gt; 중에서</cite>
    <hr />
    <!-- 인라인 인용문 -->
    <!-- q 태그는 짧은 인용문으로 일반적으로 문장 중간에 인용된 내용을 넣을 때 사용 -->
    <p>
      인상깊은 드라마를 시청했는데 대사가 마음을 움직였어. <br />
      대사는
      <q cite="https://www.tving.com/contents/P000151356"> 우리가 할 수 있는 노력은 과정이 전부야 </q>
      라는 말이었어.
    </p>
  </body>
</html>

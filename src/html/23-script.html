<!doctype html>
<html lang="ko-KR">

    <meta charset="UTF-8" />

    <link rel="shortcut icon" href="/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon/likelion.svg" type="image/svg+xml" />
    <link rel="preload" as="font" href="/font/suit/SUIT-Variable.woff2" />

    <link rel="stylesheet" href="/src/common/index.css" />
    <link rel="stylesheet" href="/src/html/styles/23-script.css" />
    <!-- async, defer 속성 모두 html 파싱과 동시에 JS 다운로드 -->
    <!-- async는 다운로드가 끝나는 즉시 실행. 순서 보장 안됨 -->
    <!-- defer는 html 파싱이 끝난 뒤 실행. 순서 보장됨 -->
    <!-- type="module"은 자동으로 defer처럼 동작 -->
    <script type="module" src="/src/html/js/23-script.js"></script>
  </head>

        <div class="card-face card-face-white"></div>
